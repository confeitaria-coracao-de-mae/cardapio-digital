<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E8191A;--rdk:#B01010;--rlt:#FDF0F0;--blk:#1A0A0A;--wht:#FFFFFF;--g1:#F7F2F2;--g2:#EDE5E5;--tx:#1A0A0A;--tx2:#5A3A3A;--tx3:#9A7A7A}
body{font-family:'Lato',sans-serif;background:var(--wht);color:var(--tx)}
.hero{background:var(--red);padding:30px 20px 22px;position:relative;overflow:hidden;text-align:center}
.hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.04) 0,rgba(255,255,255,0.04) 1px,transparent 0,transparent 50%);background-size:20px 20px}
.logo{width:86px;height:86px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;margin:0 auto 11px;position:relative;z-index:1;border:3px solid rgba(255,255,255,0.22);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hn{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;color:white;position:relative;z-index:1}
.hs{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:4px;position:relative;z-index:1}
.ht{font-size:12px;color:rgba(255,255,255,0.5);margin-top:3px;font-style:italic;position:relative;z-index:1}
.admin-badge{position:fixed;top:10px;right:10px;z-index:500;background:var(--red);color:white;border:none;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:1px;display:none;cursor:pointer}
.admin-mode .admin-badge{display:block}
.nav{background:var(--blk);position:sticky;top:0;z-index:100;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navrow{display:flex;min-width:max-content}
.nb{background:transparent;color:rgba(255,255,255,0.48);border:none;padding:13px 15px;font-family:'Lato',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .18s}
.nb:hover{color:rgba(255,255,255,0.78)}
.nb.on{color:var(--red);border-bottom-color:var(--red)}
.sec{padding-bottom:80px}
.covhdr{position:relative;height:150px;overflow:hidden;display:flex;align-items:flex-end}
.covbg{position:absolute;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center}
.covbg img{width:100%;height:100%;object-fit:cover;opacity:.4}
.covbg .noc{font-size:60px;opacity:.18}
.covol{position:absolute;inset:0;background:linear-gradient(to top,rgba(232,25,26,.93) 0%,rgba(232,25,26,.25) 100%)}
.covinfo{position:relative;z-index:2;padding:14px 18px;width:100%;display:flex;align-items:flex-end;justify-content:space-between}
.covtitle{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:white}
.covsub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:2px}
.btncov{background:rgba(0,0,0,.38);color:white;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;text-transform:uppercase;display:none}
.admin-mode .btncov{display:block}
.subseclabel{background:var(--blk);color:rgba(255,255,255,.85);padding:9px 18px;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;background:var(--g2)}
.card{background:var(--wht);cursor:pointer;transition:background .15s;display:flex;flex-direction:column;position:relative}
.card:hover{background:var(--rlt)}
.cimg{width:100%;aspect-ratio:1;background:var(--g1);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg .noph{font-size:38px;opacity:.2}
.cedit{position:absolute;inset:0;background:rgba(232,25,26,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:white;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer}
.cedit span{font-size:19px}
.admin-mode .cimg:hover .cedit{display:flex}
.cbody{padding:10px 11px 12px;flex:1;display:flex;flex-direction:column}
.cname{font-family:'Playfair Display',serif;font-size:13px;font-weight:400;line-height:1.3;color:var(--tx);margin-bottom:3px;flex:1}
.cdesc{font-size:11px;color:var(--tx3);line-height:1.35;margin-bottom:7px}
.cbot{display:flex;align-items:center;justify-content:space-between}
.cprice{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--red)}
.cunit{font-size:10px;color:var(--tx3)}
.bplus{width:27px;height:27px;border-radius:50%;background:var(--red);color:white;border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;transition:background .15s}
.bplus:hover{background:var(--rdk)}
.cart{position:fixed;bottom:0;left:0;right:0;background:var(--blk);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:200}
.cart.vis{transform:translateY(0)}
.ccnt{font-size:10px;color:rgba(255,255,255,.42);letter-spacing:1px;text-transform:uppercase}
.ctot{font-family:'Playfair Display',serif;font-size:21px;color:white}
.bwpp{background:var(--red);color:white;border:none;border-radius:10px;padding:11px 17px;font-family:'Lato',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bwpp:hover{background:var(--rdk)}
.ov{position:fixed;inset:0;background:rgba(26,10,10,.72);z-index:300;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--wht);border-radius:20px 20px 0 0;width:100%;max-width:530px;max-height:92vh;overflow-y:auto;animation:up .27s cubic-bezier(.34,1.56,.64,1)}
@keyframes up{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.mimg{width:100%;height:260px;background:var(--g1);display:flex;align-items:center;justify-content:center;border-radius:20px 20px 0 0;overflow:hidden;position:relative}
.mimg img{width:100%;height:100%;object-fit:cover}
.nophlg{font-size:58px;opacity:.18}
.rbar{position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--red)}
.mcls{position:absolute;top:11px;right:11px;width:31px;height:31px;border-radius:50%;background:rgba(26,10,10,.5);border:none;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mbdy{padding:18px 18px 6px}
.mtag{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.mttl{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:4px}
.mdsc{font-size:14px;color:var(--tx2);line-height:1.55;margin-bottom:7px}
.mdet{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--g1);border-radius:10px;padding:11px;margin-bottom:10px}
.mdlb{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:2px}
.mdvl{font-size:12px;color:var(--tx2)}
.mprc{font-family:'Playfair Display',serif;font-size:29px;font-weight:700;color:var(--red);margin:8px 0 3px}
.munt{font-size:13px;color:var(--tx3)}
.qrow{display:flex;align-items:center;gap:15px;margin:13px 0}
.qbtn{width:35px;height:35px;border-radius:50%;border:2px solid var(--g2);background:white;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);transition:border-color .15s}
.qbtn:hover{border-color:var(--red);color:var(--red)}
.qnum{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;min-width:24px;text-align:center}
.obsinp{width:100%;border:1.5px solid var(--g2);border-radius:10px;padding:10px 12px;font-family:'Lato',sans-serif;font-size:14px;color:var(--tx);background:white;resize:none;height:64px;outline:none;margin-bottom:11px}
.obsinp:focus{border-color:var(--red)}
.baddc{width:100%;background:var(--red);color:white;border:none;border-radius:12px;padding:14px;font-family:'Lato',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.baddc:hover{background:var(--rdk)}
.bcanc{width:100%;background:transparent;color:var(--tx3);border:none;padding:10px;font-family:'Lato',sans-serif;font-size:14px;cursor:pointer;margin-bottom:5px}
.senhaov{position:fixed;inset:0;background:rgba(26,10,10,.88);z-index:700;display:none;align-items:center;justify-content:center;padding:20px}
.senhaov.open{display:flex}
.senhabox{background:white;border-radius:16px;padding:24px;width:100%;max-width:320px;text-align:center}
.senhabox h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:6px}
.senhabox p{font-size:13px;color:var(--tx3);margin-bottom:18px}
.senhainp{width:100%;border:1.5px solid var(--g2);border-radius:10px;padding:12px;font-size:16px;text-align:center;letter-spacing:4px;outline:none;font-family:'Lato',sans-serif;margin-bottom:10px}
.senhainp:focus{border-color:var(--red)}
.senhainp.erro{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bsenha{width:100%;background:var(--red);color:white;border:none;border-radius:10px;padding:13px;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.bcancelsenha{width:100%;background:transparent;color:var(--tx3);border:none;padding:9px;font-family:'Lato',sans-serif;font-size:14px;cursor:pointer}
.senhahint{font-size:11px;color:var(--red);margin-top:4px;min-height:16px}
.phov{position:fixed;inset:0;background:rgba(26,10,10,.9);z-index:600;display:none;align-items:center;justify-content:center;padding:18px}
.phov.open{display:flex}
.phbox{background:white;border-radius:16px;padding:20px;width:100%;max-width:370px}
.phbox h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:5px}
.phbox p{font-size:13px;color:var(--tx3);margin-bottom:13px}
.phinp{width:100%;border:1.5px solid var(--g2);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:9px;outline:none;font-family:'Lato',sans-serif}
.phinp:focus{border-color:var(--red)}
.phprev{width:100%;height:120px;background:var(--g1);border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;overflow:hidden}
.phprev img{width:100%;height:100%;object-fit:cover}
.bsaveph{background:var(--red);color:white;border:none;border-radius:10px;padding:11px;width:100%;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:7px}
.bsaveph:disabled{background:var(--tx3);cursor:not-allowed}
.bcancelph{background:transparent;color:var(--tx3);border:none;padding:8px;width:100%;font-size:14px;cursor:pointer}
.salvando{font-size:12px;color:var(--tx3);text-align:center;margin-top:4px}
.foot{background:var(--blk);color:white;text-align:center;padding:24px 20px 100px}
.fn{font-family:'Playfair Display',serif;font-size:16px;margin-bottom:5px}
.fi{font-size:12px;color:rgba(255,255,255,.42);line-height:1.9}
.fr{color:var(--red)}

/* ── Botão flutuante WhatsApp ── */
.wpp-float{
  position:fixed;
  bottom:80px;
  right:18px;
  z-index:299;
  width:54px;
  height:54px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 16px rgba(37,211,102,0.45);
  cursor:pointer;
  text-decoration:none;
  transition:transform .2s, box-shadow .2s;
  animation: pulse-wpp 2.5s infinite;
}
.wpp-float:hover{transform:scale(1.08);box-shadow:0 6px 22px rgba(37,211,102,0.55)}
@keyframes pulse-wpp{
  0%,100%{box-shadow:0 4px 16px rgba(37,211,102,0.45)}
  50%{box-shadow:0 4px 28px rgba(37,211,102,0.75)}
}
/* Esconde quando o carrinho estiver visível pra não sobrepor */
.cart.vis ~ .wpp-float{bottom:90px}
</style>

const UTM_MSG_MAP = {
  'google_maps': 'Olá, vim pelo Google Maps e gostaria de fazer um orçamento',
  'instagram':   'Olá, vim pelo Instagram e gostaria de fazer um orçamento',
  'facebook':    'Olá, vim pelo Facebook e gostaria de fazer um orçamento',
  'meta':        'Olá, vi o anúncio e gostaria de fazer um orçamento',
  'google':      'Olá, vim pelo google ads e gostaria de fazer um orçamento',
};

function getUtmKeyword() {
  const params = new URLSearchParams(window.location.search);
  const source = params.get('utm_source') || '';
  return UTM_KEYWORD_MAP[source.toLowerCase()] || 'cardapio';
}

function getUtmMsg() {
  const params = new URLSearchParams(window.location.search);
  const source = params.get('utm_source') || '';
  return UTM_MSG_MAP[source.toLowerCase()] || 'Olá, gostaria de fazer um orçamento';
}

function buildWppUrl(msgExtra) {
  const keyword = getUtmKeyword();
  const msgBase = getUtmMsg();
  const texto = msgExtra ? `${keyword} ${msgExtra}` : `${keyword} ${msgBase}`;
  return `https://wa.me/${WPP}?text=${encodeURIComponent(texto)}`;
}

async function carregarFotos() {
  try {
    const r = await fetch(SCRIPT_URL + '?acao=listarFotos');
    const j = await r.json();
    if (j.fotos) { fotos = {...fotos, ...j.fotos}; renderContent(); }
  } catch(e) { console.warn('Fotos offline', e); }
}

// ── Admin: 5 cliques no logo + senha ──
function logoClick() {
  logoClicks++;
  clearTimeout(logoTimer);
  if (logoClicks >= 5) { logoClicks = 0; abrirSenha(); return; }
  logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
}

function abrirSenha() {
  document.getElementById('senhainp').value = '';
  document.getElementById('senhahint').textContent = '';
  document.getElementById('senhainp').classList.remove('erro');
  document.getElementById('senhaov').classList.add('open');
  setTimeout(() => document.getElementById('senhainp').focus(), 300);
}

function fechaSenha() { document.getElementById('senhaov').classList.remove('open'); }

function verificaSenha() {
  const inp = document.getElementById('senhainp');
  if (inp.value === SENHA) {
    fechaSenha(); admin = true;
    document.body.classList.add('admin-mode');
    renderContent();
  } else {
    inp.classList.remove('erro');
    void inp.offsetWidth;
    inp.classList.add('erro');
    document.getElementById('senhahint').textContent = 'Senha incorreta.';
    inp.value = '';
    setTimeout(() => inp.focus(), 100);
  }
}

function sairAdmin() {
  admin = false;
  document.body.classList.remove('admin-mode');
  renderContent();
}

function renderNav() {
  document.getElementById('navrow').innerHTML = CATS.map(c =>
    `<button class="nb ${catAtiva===c.key?'on':''}" onclick="setCat('${c.key}')">${c.icon} ${c.label}</button>`
  ).join('');
}

function setCat(k) { catAtiva=k; renderNav(); renderContent(); document.querySelector('.nav').scrollIntoView({behavior:'smooth',block:'start'}); }

function covHdr(cat) {
  const cov = gc(cat.key);
  return `<div class="covhdr">
    <div class="covbg">${cov?`<img src="${cov}" alt="${cat.label}" onerror="this.style.display='none'">`:`<span class="noc">${cat.icon}</span>`}</div>
    <div class="covol"></div>
    <div class="covinfo">
      <div><div class="covtitle">${cat.label}</div><div class="covsub">${cat.sub||''}</div></div>
      <button class="btncov" onclick="abrirPh('cover','${cat.key}','Foto de capa — ${cat.label}','Cole a URL da imagem de capa')">📷 Capa</button>
    </div>
  </div>`;
}

function cardH(p, icon) {
  const foto = gf(p.id);
  return `<div class="card" onclick="abrirProd('${p.id}')">
    <div class="cimg">
      ${foto?`<img src="${foto}" alt="${p.n}" onerror="this.style.display='none'">`:`<span class="noph">${icon}</span>`}
      <div class="cedit" onclick="event.stopPropagation();abrirPh('prod','${p.id}','Foto — ${p.n.replace(/'/g,"\\'")}','Cole a URL da imagem')"><span>📷</span>Foto</div>
    </div>
    <div class="cbody">
      <div class="cname">${p.n}</div>
      ${p.desc?`<div class="cdesc">${p.desc}</div>`:''}
      <div class="cbot">
        <div><div class="cprice">${fmt(p.p)}</div>${p.u?`<div class="cunit">por ${p.u}</div>`:''}</div>
        <button class="bplus" onclick="event.stopPropagation();addD('${p.id}')">+</button>
      </div>
    </div>
  </div>`;
}

function renderContent() {
  const cat = CATS.find(c => c.key === catAtiva); if (!cat) return;
  let html = `<div class="sec">${covHdr(cat)}`;
  cat.grupos.forEach(g => {
    html += `<div class="subseclabel">${g.t}</div><div class="grid">`;
    g.itens.forEach(p => { html += cardH(p, cat.icon); });
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function getP(id) {
  for (const cat of CATS) for (const g of cat.grupos) { const p = g.itens.find(x=>x.id===id); if(p) return {p,cat}; }
  return null;
}

function abrirProd(id) {
  const res = getP(id); if (!res) return;
  const {p, cat} = res;
  prodAtual = id; qty = 1;
  document.getElementById('qnum').textContent = 1;
  document.getElementById('obsinp').value = '';
  document.getElementById('mtag').textContent = cat.label + (cat.sub?' · '+cat.sub:'');
  document.getElementById('mttl').textContent = p.n;
  document.getElementById('mdsc').textContent = p.desc || '';
  document.getElementById('mprc').textContent = fmt(p.p);
  document.getElementById('munt').textContent = p.u ? 'por '+p.u : '';
  const det = document.getElementById('mdet');
  if (p.det && Object.keys(p.det).length) {
    det.style.display = 'grid';
    det.innerHTML = Object.entries(p.det).map(([k,v])=>`<div><div class="mdlb">${k}</div><div class="mdvl">${v}</div></div>`).join('');
  } else det.style.display = 'none';
  const foto = gf(id);
  document.getElementById('mimg').innerHTML = foto
    ? `<img src="${foto}" style="width:100%;height:100%;object-fit:cover"><div class="rbar"></div>`
    : `<span class="nophlg">${cat.icon}</span><div class="rbar"></div>`;
  document.getElementById('ov').classList.add('open');
}

function fechaProd(e) { if (!e || e.target===document.getElementById('ov')) document.getElementById('ov').classList.remove('open'); }
function chQ(d) { qty = Math.max(1, qty+d); document.getElementById('qnum').textContent = qty; }

function addCart() {
  if (!prodAtual) return;
  const res = getP(prodAtual); if (!res) return;
  const {p} = res;
  const obs = document.getElementById('obsinp').value.trim();
  const ex = carrinho.find(i => i.id===p.id && i.obs===obs);
  if (ex) ex.qty += qty; else carrinho.push({id:p.id,n:p.n,p:p.p,u:p.u||'',qty,obs});
  document.getElementById('ov').classList.remove('open');
  updCart();
}

function addD(id) {
  const res = getP(id); if (!res) return;
  const {p} = res;
  const ex = carrinho.find(i => i.id===id && !i.obs);
  if (ex) ex.qty++; else carrinho.push({id,n:p.n,p:p.p,u:p.u||'',qty:1,obs:''});
  updCart();
}

function updCart() {
  const tot = carrinho.reduce((s,i) => s+i.p*i.qty, 0);
  const cnt = carrinho.reduce((s,i) => s+i.qty, 0);
  document.getElementById('ccnt').textContent = cnt + (cnt===1?' ITEM':' ITENS');
  document.getElementById('ctot').textContent = fmt(tot);
  document.getElementById('cart').classList.toggle('vis', carrinho.length > 0);
}

function enviar() {
  if (!carrinho.length) return;
  let msg = '🍰 *Olá! Gostaria de fazer um pedido no Coração de Mãe:*\n\n';
  carrinho.forEach(i => {
    msg += `• *${i.n}* x${i.qty} — ${fmt(i.p*i.qty)}`;
    if (i.u) msg += ` (${i.u})`;
    if (i.obs) msg += `\n  _Obs: ${i.obs}_`;
    msg += '\n';
  });
  const tot = carrinho.reduce((s,i) => s+i.p*i.qty, 0);
  msg += `\n*Total estimado: ${fmt(tot)}*\n\nAguardo confirmação! 😊`;

  // ── Rastreamento: dispara evento pro GTM antes de abrir o WhatsApp ──
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'clique_whatsapp',
    origem_clique: 'carrinho',
    utm_source: new URLSearchParams(window.location.search).get('utm_source') || 'direto',
    valor_carrinho: parseFloat(tot.toFixed(2)),
    qtd_itens: carrinho.reduce((s,i) => s+i.qty, 0),
    currency: 'BRL'
  });

  // Adiciona keyword de origem à mensagem
  const keyword = getUtmKeyword();
  const msgFinal = `${keyword} ${msg}`;
  window.open(`https://wa.me/${WPP}?text=${encodeURIComponent(msgFinal)}`, '_blank');
}

// ── Fotos via Sheets ──
function abrirPh(type, id, title, sub) {
  phTyp = type; phTgt = id;
  document.getElementById('phtitle').textContent = title;
  document.getElementById('phsub').textContent = sub;
  const cur = type === 'cover' ? gc(id) : gf(id);
  document.getElementById('phinp').value = cur || '';
  document.getElementById('salvando').textContent = '';
  document.getElementById('bsaveph').disabled = false;
  phPrev();
  document.getElementById('phov').classList.add('open');
}

function fechaPh() { document.getElementById('phov').classList.remove('open'); }

function phPrev() {
  const u = document.getElementById('phinp').value.trim();
  document.getElementById('phprev').innerHTML = u
    ? `<img src="${u}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<span style=font-size:26px;opacity:.3>❌</span>'">`
    : `<span style="font-size:26px;opacity:.28">📷</span>`;
}

async function salvaFoto() {
  const url = document.getElementById('phinp').value.trim();
  const key = phTyp === 'cover' ? 'c_' + phTgt : 'f_' + phTgt;
  const btn = document.getElementById('bsaveph');
  const msg = document.getElementById('salvando');

  btn.disabled = true;
  msg.textContent = '⏳ Salvando no Google Sheets...';

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ acao: url ? 'salvarFoto' : 'apagarFoto', id: key, url })
    });
    if (url) fotos[key] = url; else delete fotos[key];
    msg.textContent = '✓ Salvo! Aparece pra todos agora.';
    setTimeout(() => { fechaPh(); renderContent(); }, 1200);
  } catch(e) {
    msg.textContent = '❌ Erro ao salvar. Tente novamente.';
    btn.disabled = false;
  }
}

// ── Init ──
renderNav();
renderContent();
carregarFotos();

// ── Rastreamento botão flutuante WhatsApp ──
function abrirWppFlutuante(e) {
  e.preventDefault();
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'clique_whatsapp',
    origem_clique: 'botao_flutuante',
    utm_source: new URLSearchParams(window.location.search).get('utm_source') || 'direto',
    valor_carrinho: 0,
    qtd_itens: 0,
    currency: 'BRL'
  });
  window.open(buildWppUrl(), '_blank');
}
